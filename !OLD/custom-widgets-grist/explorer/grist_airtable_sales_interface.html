<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grist Interface Studio</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bg:#fff;--panel:#f5f7fb;--panel2:#fafbfc;--line:#dce1e7;--line2:#eaedf1;
  --text:#171a1f;--muted:#69717d;--blue:#0b73d9;--red:#e4003b;--green:#0b8d28;
  --yellow:#ffb800;--orange:#bf6500;--cyan:#12c9bf;--chip:#eaf0f8;
  --shadow:0 18px 55px rgba(20,28,38,.18);--r:8px;
  --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);font-size:12px;color:var(--text);background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#0968d8;text-decoration:none}
.hidden{display:none!important}
.topbar{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;background:#fff;position:sticky;top:0;z-index:40}
.brandmark{font-weight:750;font-size:14px}
.mode-switch{display:flex;background:#f1f3f6;border-radius:7px;padding:3px;margin-left:10px}
.mode-switch button{border:0;background:transparent;border-radius:5px;padding:6px 12px;color:#5d6570}
.mode-switch button.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:#111;font-weight:650}
.spacer{flex:1}
.btn{border:1px solid #cfd5dc;background:#fff;border-radius:6px;padding:7px 10px;min-height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#f7f8fa}
.btn-primary{background:#0b73d9;border-color:#0b73d9;color:#fff;font-weight:650}
.btn-danger{background:#fff1f3;border-color:#f2bdc8;color:#b5002f}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;font-weight:650}
.btn-dark{background:#24282d;border-color:#24282d;color:#fff}
.shell{min-height:calc(100vh - 48px)}
.builder{display:grid;grid-template-columns:244px minmax(600px,1fr) 286px;min-height:calc(100vh - 48px)}
.sidebar{border-right:1px solid var(--line);background:#fafbfc;padding:14px;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.sidebar.right{border-right:0;border-left:1px solid var(--line);background:#fff}
.side-title{font-weight:750;font-size:12px;margin-bottom:10px}
.muted{color:var(--muted)}
.side-card{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;margin-bottom:10px}
.side-card h4{margin:0 0 8px;font-size:12px}
.row{display:flex;align-items:center;gap:7px}
.stack{display:flex;flex-direction:column;gap:8px}
.inp,.sel,.area{width:100%;border:1px solid #cfd5dc;border-radius:6px;background:#fff;padding:7px 8px;outline:none}
.area{min-height:78px;resize:vertical}
.inp:focus,.sel:focus,.area:focus{border-color:#7ba7d5;box-shadow:0 0 0 2px rgba(11,115,217,.08)}
.small{font-size:10px}
.hr{height:1px;background:var(--line2);margin:13px 0}
.tab-list{display:flex;flex-direction:column;gap:4px}
.tab-row{display:flex;align-items:center;border:1px solid transparent;border-radius:6px;padding:5px 6px;gap:5px}
.tab-row:hover{background:#f1f3f6}
.tab-row.active{background:#eaf2fb;border-color:#cbdff3}
.tab-row button.name{border:0;background:transparent;text-align:left;flex:1;padding:3px}
.icon-btn{border:0;background:transparent;border-radius:4px;padding:4px 6px;color:#59616d}
.icon-btn:hover{background:#e7eaf0}
.canvas-wrap{background:#f7f8fa;padding:22px;overflow:auto}
.canvas{max-width:1080px;margin:0 auto;background:#fff;min-height:700px;border-radius:7px;box-shadow:0 0 0 1px #e2e5e9}
.design .canvas{outline:1px dashed #a8b0bc;outline-offset:5px}
.page-head{padding:24px 14px 0}
.page-title-row{display:flex;align-items:center;gap:12px}
.page-title{font-size:27px;font-weight:760;margin:0 0 18px}
.header-actions{margin-left:auto;display:flex;gap:7px;margin-bottom:15px}
.recordbar{display:flex;align-items:center;gap:8px;padding:0 14px 10px;color:#616976}
.recordbar select{max-width:260px}
.tabs{display:flex;align-items:flex-end;gap:28px;border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
.tab{border:0;background:transparent;padding:0 0 12px;color:#59616d;position:relative}
.tab.active{font-weight:700;color:#111}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#111}
.add-tab-inline{border:1px dashed #bac1ca;background:#fff;border-radius:5px;padding:5px 8px;margin-bottom:7px;color:#5f6873}
.content{padding:16px 14px 36px}
.section{background:var(--panel);border-radius:5px;margin-bottom:20px;padding:13px 12px 16px;position:relative}
.design .section{outline:1px dashed transparent}
.design .section:hover{outline-color:#9ca8b6}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:25px}
.section-title{font-size:14px;font-weight:750}
.section-tools{margin-left:auto;display:flex;gap:4px}
.section-tools button,.field-tools button{border:0;background:#fff;border:1px solid #d3d9e0;border-radius:5px;padding:4px 7px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.field{min-width:0;position:relative;border-radius:5px}
.design .field{border:1px dashed #bdc5cf;background:rgba(255,255,255,.5);padding:8px;min-height:70px}
.design .field:hover{border-color:#538dcc;background:#fff}
.field.dragging{opacity:.4}
.field.drop-target{outline:2px solid #2b7bd0}
.field-tools{display:none;position:absolute;right:4px;top:4px;z-index:2;gap:3px}
.design .field:hover .field-tools{display:flex}
.field-label{font-size:10.5px;font-weight:700;margin-bottom:6px;min-height:13px}
.field-help{font-size:9px;color:#8b929c;margin-top:4px}
.field-view{min-height:27px}
.display-text{line-height:1.5;white-space:pre-wrap}
.big-number{font-weight:750;font-size:26px}
.control{width:100%;min-height:31px;border:1px solid #cbd1d8;border-radius:5px;background:#fff;padding:6px 7px}
textarea.control{min-height:62px;resize:vertical}
.choice-stack{display:flex;flex-direction:column;gap:7px}
.choice-line{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0;text-align:left}
.radio{width:15px;height:15px;border:1px solid #d7dbe1;background:#fff;border-radius:50%;position:relative;flex:0 0 auto}
.radio.on:after{content:"";position:absolute;inset:3px;background:#282c31;border-radius:50%}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;min-height:19px;background:#fff;border:1px solid #d6dce5;color:#4f5b68}
.pill.green{background:#078d26;color:#fff;border-color:#078d26}
.pill.yellow{background:#ffb800;color:#2e2500;border-color:#ffb800}
.pill.orange{background:#bd6700;color:#fff;border-color:#bd6700}
.pill.red{background:#e0003c;color:#fff;border-color:#e0003c}
.pill.blue{background:#176fd6;color:#fff;border-color:#176fd6}
.pill.cyan{background:#11c9bf;color:#073f3b;border-color:#11c9bf}
.pill.gray{background:#e8edf4;color:#39424d;border-color:#e8edf4}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#e8eef7;border-radius:2px;padding:3px 5px}
.dropzone{height:145px;border:1px solid #cbd1d8;border-radius:8px;background:#e9eaee;display:flex;align-items:center;justify-content:center;color:#818995}
.urlbox{border:1px solid #cbd1d8;border-radius:5px;background:#fff;padding:6px 7px;min-height:29px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checkbox-line{display:flex;align-items:center;gap:7px;min-height:28px}
.checkbox-line input{width:16px;height:16px}
.add-field{border:1px dashed #abb5c1;background:rgba(255,255,255,.58);border-radius:5px;min-height:66px;color:#65707d}
.empty-section{grid-column:1/-1;border:1px dashed #b9c1cb;border-radius:6px;padding:24px;text-align:center;color:#7a838e;background:rgba(255,255,255,.5)}
.blank-state{padding:90px 30px;text-align:center}
.blank-state h2{font-size:22px;margin:0 0 10px}
.blank-state p{color:#69717d;max-width:540px;margin:0 auto 18px;line-height:1.55}
.inspector-empty{padding:30px 8px;color:#7c8490;text-align:center;line-height:1.5}
.width-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.width-buttons button{border:1px solid #cfd5dc;background:#fff;border-radius:5px;padding:6px 2px}
.width-buttons button.active{background:#e8f2fd;border-color:#70a5d8;color:#0a64ba;font-weight:650}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette button{border:1px solid #d6dbe1;background:#fff;border-radius:6px;padding:8px 6px;text-align:left}
.palette button:hover{border-color:#7da5d0;background:#f5f9fe}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,30,.38);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{width:min(650px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:var(--shadow)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{font-size:16px;margin:0}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:155px 1fr;gap:12px 15px;align-items:center}
.form-grid .wide{grid-column:1/-1}
.label{font-weight:650}
.choice-editor{display:flex;flex-direction:column;gap:6px}
.choice-edit-row{display:grid;grid-template-columns:22px 1fr 28px;gap:6px;align-items:center}
.color-dot{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.notice{padding:10px 11px;border:1px solid #dfe4ea;background:#f7f9fc;border-radius:7px;color:#5f6874;line-height:1.45}
.toast{position:fixed;right:18px;bottom:17px;background:#25292e;color:#fff;border-radius:7px;padding:10px 13px;box-shadow:var(--shadow);z-index:150;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateY(0)}
.preview-only{}
.design-only{}
.preview .design-only{display:none!important}
.design .preview-only{display:none!important}
.static-note{white-space:pre-wrap;line-height:1.5}
.section-add{border:1px dashed #aeb8c3;border-radius:7px;background:#fff;padding:14px;text-align:center;color:#626d79;width:100%}
.drag-handle{color:#929aa5;cursor:grab}
@media(max-width:1050px){
  .builder{grid-template-columns:210px minmax(520px,1fr)}
  .sidebar.right{display:none}
}
@media(max-width:760px){
  .builder{display:block}
  .sidebar{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .canvas-wrap{padding:10px}.grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brandmark">Interface Studio</div>
  <div class="mode-switch">
    <button id="designMode" class="active">Design</button>
    <button id="previewMode">Preview</button>
  </div>
  <div class="spacer"></div>
  <span class="muted small" id="statusText">Starting…</span>
  <button class="btn" id="dataBtn">Data source</button>
  <button class="btn btn-primary" id="saveBtn">Save interface</button>
</div>
<div class="shell design" id="shell">
  <div class="builder">
    <aside class="sidebar" id="leftSidebar"></aside>
    <main class="canvas-wrap">
      <div class="canvas" id="canvas"></div>
    </main>
    <aside class="sidebar right" id="rightSidebar"></aside>
  </div>
</div>

<div class="modal-bg" id="fieldModal">
  <div class="modal">
    <div class="modal-head"><h3 id="fieldModalTitle">Add field</h3><button class="icon-btn spacer" data-close="fieldModal">✕</button></div>
    <div class="modal-body" id="fieldModalBody"></div>
    <div class="modal-foot"><button class="btn" data-close="fieldModal">Cancel</button><button class="btn btn-primary" id="fieldSaveBtn">Add field</button></div>
  </div>
</div>

<div class="modal-bg" id="sectionModal">
  <div class="modal">
    <div class="modal-head"><h3 id="sectionModalTitle">Add section</h3><button class="icon-btn spacer" data-close="sectionModal">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="label">Section title</label><input class="inp" id="sectionName" placeholder="USA Knowledgebase: Main Information">
        <label class="label">Background</label>
        <select class="sel" id="sectionBackground"><option value="panel">Light panel</option><option value="plain">White / plain</option></select>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="sectionModal">Cancel</button><button class="btn btn-primary" id="sectionSaveBtn">Add section</button></div>
  </div>
</div>

<div class="modal-bg" id="tabModal">
  <div class="modal">
    <div class="modal-head"><h3>Add tab</h3><button class="icon-btn spacer" data-close="tabModal">✕</button></div>
    <div class="modal-body">
      <label class="label">Tab name</label><input class="inp" id="tabName" style="margin-top:7px" placeholder="Attachments">
    </div>
    <div class="modal-foot"><button class="btn" data-close="tabModal">Cancel</button><button class="btn btn-primary" id="tabSaveBtn">Add tab</button></div>
  </div>
</div>

<div class="modal-bg" id="dataModal">
  <div class="modal">
    <div class="modal-head"><h3>Data source</h3><button class="icon-btn spacer" data-close="dataModal">✕</button></div>
    <div class="modal-body" id="dataModalBody"></div>
    <div class="modal-foot"><button class="btn" data-close="dataModal">Close</button></div>
  </div>
</div>

<div class="modal-bg" id="buttonModal">
  <div class="modal">
    <div class="modal-head"><h3>Header button</h3><button class="icon-btn spacer" data-close="buttonModal">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="label">Button label</label><input class="inp" id="headerButtonLabel" placeholder="Find on Top3DShop!">
        <label class="label">URL column</label><select class="sel" id="headerButtonColumn"></select>
        <label class="label">Style</label><select class="sel" id="headerButtonStyle"><option value="red">Red</option><option value="blue">Blue</option><option value="dark">Dark</option><option value="white">White</option></select>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close="buttonModal">Cancel</button><button class="btn btn-primary" id="headerButtonSave">Save button</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";

const TYPE_DEFS = {
  text:{label:"Single line text",grist:"Text"},
  longText:{label:"Long text",grist:"Text"},
  number:{label:"Number",grist:"Numeric"},
  currency:{label:"Currency",grist:"Numeric"},
  percent:{label:"Percent",grist:"Numeric"},
  singleSelect:{label:"Single select",grist:"Choice"},
  multiSelect:{label:"Multi select",grist:"ChoiceList"},
  checkbox:{label:"Checkbox",grist:"Bool"},
  url:{label:"URL",grist:"Text"},
  email:{label:"Email",grist:"Text"},
  phone:{label:"Phone",grist:"Text"},
  date:{label:"Date",grist:"Date"},
  attachment:{label:"Attachment",grist:"Attachments"},
  reference:{label:"Linked record",grist:"Ref"},
  referenceList:{label:"Multiple linked records",grist:"RefList"},
  staticText:{label:"Text block",grist:null},
  button:{label:"Button",grist:null}
};
const COLORS=["green","yellow","orange","red","blue","cyan","gray"];
const COLOR_HEX={
  green:{fill:"#0b8f27",text:"#ffffff"},yellow:{fill:"#ffb800",text:"#282000"},
  orange:{fill:"#bd6700",text:"#ffffff"},red:{fill:"#e0003c",text:"#ffffff"},
  blue:{fill:"#176fd6",text:"#ffffff"},cyan:{fill:"#11c9bf",text:"#073f3b"},
  gray:{fill:"#e8edf4",text:"#39424d"}
};

const uid=()=>Math.random().toString(36).slice(2,9);
const deep=x=>JSON.parse(JSON.stringify(x));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const safeId=s=>{
  let x=String(s||"Field").trim().replace(/[^A-Za-z0-9_]+/g,"_").replace(/^_+|_+$/g,"");
  if(!x)x="Field"; if(/^[0-9]/.test(x))x="F_"+x; return x;
};
const decodeList=v=>Array.isArray(v)&&v[0]==="L"?v.slice(1):(Array.isArray(v)?v:[]);
const encodeList=v=>["L",...(v||[])];

function emptyConfig(){
  const tabId=uid(),secId=uid();
  return {
    version:3,
    interfaceName:"Brand Interface",
    tableId:"",
    titleField:"",
    selectedRecordId:null,
    mode:"design",
    headerButtons:[],
    activeTabId:tabId,
    tabs:[{id:tabId,name:"Main Information",sections:[
      {id:secId,title:"Main Information",background:"panel",fields:[]}
    ]}]
  };
}

const demoTable={
  id:"Brands",
  columns:["Name","Website","Priority","Relevancy","Description","Margin","Technologies"],
  rows:[
    {id:1,Name:"Anisoprint",Website:"https://anisoprint.com/",Priority:"1st priority",Relevancy:"Obsolete",
     Description:"Luxembourg-based company specializing in composite fiber 3D printing technology.",
     Margin:26.7,Technologies:["L","Continuous CF 3D Printer","Slicer Software","FDM 3D printers"]}
  ]
};

const state={
  inGrist:false,
  config:emptyConfig(),
  tables:[],
  columns:[],
  rows:[],
  tableCache:{},
  mode:"design",
  selected:{kind:null,id:null,sectionId:null,tabId:null},
  editField:null,
  editSection:null,
  pendingFieldSection:null,
  saveTimer:null
};

const $=s=>document.querySelector(s);
const shell=$("#shell"),canvas=$("#canvas"),left=$("#leftSidebar"),right=$("#rightSidebar"),toast=$("#toast");

function toastMsg(m){
  toast.textContent=m;toast.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("show"),1900);
}
function openModal(id){$("#"+id).classList.add("open")}
function closeModal(id){$("#"+id).classList.remove("open")}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll(".modal-bg").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));

function toRows(raw){
  if(Array.isArray(raw))return raw;
  if(!raw||typeof raw!=="object")return[];
  const ks=Object.keys(raw);
  const n=Math.max(0,...ks.map(k=>Array.isArray(raw[k])?raw[k].length:0));
  return Array.from({length:n},(_,i)=>{
    const r={};for(const k of ks)r[k]=Array.isArray(raw[k])?raw[k][i]:undefined;return r;
  });
}
function activeTab(){
  return state.config.tabs.find(t=>t.id===state.config.activeTabId)||state.config.tabs[0];
}
function findSection(id){
  for(const t of state.config.tabs){const s=t.sections.find(x=>x.id===id);if(s)return s}return null;
}
function findField(id){
  for(const t of state.config.tabs)for(const s of t.sections){const f=s.fields.find(x=>x.id===id);if(f)return f}return null;
}
function currentRecord(){
  return state.rows.find(r=>Number(r.id)===Number(state.config.selectedRecordId))||state.rows[0]||null;
}
function columnOptions(selected="",blank="— choose column —"){
  return `<option value="">${esc(blank)}</option>`+state.columns.map(c=>`<option value="${esc(c)}" ${c===selected?"selected":""}>${esc(c)}</option>`).join("");
}
function tableOptions(selected="",blank="— choose table —"){
  return `<option value="">${esc(blank)}</option>`+state.tables.map(c=>`<option value="${esc(c)}" ${c===selected?"selected":""}>${esc(c)}</option>`).join("");
}

async function init(){
  try{
    if(!window.grist||!grist.docApi)throw new Error("standalone");
    state.inGrist=true;
    grist.ready({
      requiredAccess:"full",
      allowSelectBy:true,
      onEditOptions:()=>setMode("design")
    });
    state.tables=(await grist.docApi.listTables()).filter(t=>!String(t).startsWith("_"));
    const opts=await grist.widgetApi.getOptions().catch(()=>null);
    if(opts?.interfaceBuilderConfig)state.config={...emptyConfig(),...opts.interfaceBuilderConfig};
    if(state.config.tableId&&!state.tables.includes(state.config.tableId))state.config.tableId="";
    if(state.config.tableId)await loadTable(state.config.tableId);
    $("#statusText").textContent="Live Grist";
  }catch(e){
    state.inGrist=false;
    state.tables=["Brands"];
    state.config.tableId="Brands";
    state.config.titleField="Name";
    state.columns=[...demoTable.columns];
    state.rows=deep(demoTable.rows);
    state.config.selectedRecordId=1;
    $("#statusText").textContent="Standalone demo";
  }
  state.mode=state.config.mode||"design";
  renderAll();
  if(state.inGrist&&!state.config.tableId)setTimeout(()=>openDataModal(),50);
}

async function loadTable(tableId){
  if(!tableId){state.columns=[];state.rows=[];return}
  if(!state.inGrist){
    state.columns=[...demoTable.columns];state.rows=deep(demoTable.rows);return;
  }
  const raw=await grist.docApi.fetchTable(tableId);
  state.columns=Object.keys(raw).filter(k=>k!=="id"&&k!=="manualSort");
  state.rows=toRows(raw);
  state.tableCache[tableId]={columns:[...state.columns],rows:state.rows};
  if(!state.config.selectedRecordId&&state.rows[0])state.config.selectedRecordId=state.rows[0].id;
  if(state.config.selectedRecordId&&!state.rows.some(r=>Number(r.id)===Number(state.config.selectedRecordId))){
    state.config.selectedRecordId=state.rows[0]?.id??null;
  }
}

async function persist(silent=false){
  state.config.mode=state.mode;
  if(state.inGrist){

}

}

function renderSection(sec){
  const bg=sec.background==="plain"?"background:#fff;border-top:1px solid var(--line);border-radius:0;padding-left:0;padding-right:0":"";

    </div>

    </div>
  </section>`;
}
function spanStyle(f){return `grid-column:span ${Math.max(1,Math.min(4,Number(f.span)||1))}`}
function renderField(f,sectionId){
  return `<div class="field" draggable="${state.mode==="design"?"true":"false"}" data-fieldid="${f.id}" data-sectionid="${sectionId}" style="${spanStyle(f)}">
    <div class="field-tools design-only"><button data-editfield="${f.id}">✎</button><button data-delfield="${f.id}">×</button></div>
    ${f.showLabel!==false?`<div class="field-label">${esc(f.label||f.columnId||"Field")}</div>`:""}
    <div class="field-view">${renderFieldValue(f,currentRecord())}</div>
    ${state.mode==="design"?`<div class="field-help">${esc(TYPE_DEFS[f.type]?.label||f.type)}${f.columnId?` · ${esc(f.columnId)}`:""}</div>`:""}
  </div>`;
}
function renderFieldValue(f,rec){
  const v=rec&&f.columnId?rec[f.columnId]:null;
  switch(f.type){
    case "staticText": return `<div class="static-note">${esc(f.staticText||"Text block")}</div>`;
    case "button":{
      const href=rec&&f.urlColumn?rec[f.urlColumn]:"#";
      return `<a class="btn ${f.buttonStyle==="red"?"btn-red":f.buttonStyle==="blue"?"btn-primary":f.buttonStyle==="dark"?"btn-dark":""}" href="${esc(href||"#")}" ${href?'target="_blank"':""}>${esc(f.buttonLabel||f.label||"Open")} ↗</a>`;
    }
    case "longText": return `<textarea class="control" data-editvalue="${f.id}">${esc(v??"")}</textarea>`;
    case "number": return `<input class="control" type="number" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "currency": return state.mode==="preview"?`<div class="big-number">${v==null||v===""?"–":"$"+Number(v).toLocaleString("en-US")}</div>`:`<input class="control" type="number" step="0.01" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "percent": return state.mode==="preview"?`<div class="big-number">${v==null||v===""?"–":Number(v).toFixed(1)+"%"}</div>`:`<input class="control" type="number" step="0.1" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "checkbox": return `<label class="checkbox-line"><input type="checkbox" data-editcheck="${f.id}" ${v?"checked":""}><span>${v?"Yes":"No"}</span></label>`;
    case "url": return state.mode==="preview"?`<div class="urlbox"><a href="${esc(v||"#")}" target="_blank">${esc(v||"–")}</a></div>`:`<input class="control" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "email": return state.mode==="preview"?`<div class="urlbox"><a href="mailto:${esc(v||"")}">${esc(v||"–")}</a></div>`:`<input class="control" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "phone": return `<input class="control" data-editvalue="${f.id}" value="${esc(v??"")}">`;
    case "date": return `<input class="control" type="date" data-editvalue="${f.id}" value="${esc(formatDateInput(v))}">`;
    case "singleSelect":{
      const choices=f.choices||[];
      return `<div class="choice-stack">${choices.map((c,i)=>{
        const on=String(v??"")===String(c.label);
        return `<button class="choice-line" data-choicefield="${f.id}" data-choice="${esc(c.label)}"><span class="radio ${on?"on":""}"></span><span class="pill ${on?(c.color||COLORS[i%COLORS.length]):""}">${esc(c.label)}</span></button>`
      }).join("")||`<span class="muted">No choices yet</span>`}</div>`;
    }
    case "multiSelect":{
      const vals=decodeList(v).map(String);
      return `<div class="chips">${vals.map((x,i)=>{
        const c=(f.choices||[]).find(c=>String(c.label)===x);
        return `<span class="pill ${c?.color||COLORS[i%COLORS.length]}">${esc(x)}</span>`
      }).join("")||`<span class="muted">–</span>`}</div>
      <div class="design-only" style="margin-top:6px"><button class="btn" data-multiedit="${f.id}">Edit choices</button></div>`;
    }
    case "attachment":{
      const ids=decodeList(v);
      return `<div class="dropzone">◎&nbsp; ${ids.length?`${ids.length} attachment${ids.length>1?"s":""}`:"Drop zone / attachment field"}</div>`;
    }
    case "reference":
    case "referenceList":{
      const vals=f.type==="referenceList"?decodeList(v):[v];
      return `<div class="chips">${vals.filter(x=>x!==null&&x!==undefined&&x!=="").map(x=>`<span class="chip">#${esc(x)}</span>`).join("")||`<span class="muted">–</span>`}</div>`;
    }
    default:return `<input class="control" data-editvalue="${f.id}" value="${esc(v??"")}">`;
  }
}
function formatDateInput(v){
  if(!v)return"";
  if(typeof v==="number"){
    const d=new Date(v*1000);return d.toISOString().slice(0,10);
  }
  return String(v).slice(0,10);
}

function setupDrag(el){
  el.addEventListener("dragstart",e=>{
    el.classList.add("dragging");
    e.dataTransfer.setData("text/plain",JSON.stringify({fieldId:el.dataset.fieldid,sectionId:el.dataset.sectionid}));
  });
  el.addEventListener("dragend",()=>el.classList.remove("dragging"));
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drop-target")});
  el.addEventListener("dragleave",()=>el.classList.remove("drop-target"));
  el.addEventListener("drop",e=>{
    e.preventDefault();el.classList.remove("drop-target");
    let data;try{data=JSON.parse(e.dataTransfer.getData("text/plain"))}catch{return}
    moveField(data.fieldId,data.sectionId,el.dataset.fieldid,el.dataset.sectionid);
  });
}
function moveField(fieldId,fromSecId,targetId,toSecId){
  const from=findSection(fromSecId),to=findSection(toSecId);if(!from||!to)return;
  const idx=from.fields.findIndex(f=>f.id===fieldId);if(idx<0)return;
  const [f]=from.fields.splice(idx,1);let ti=to.fields.findIndex(x=>x.id===targetId);if(ti<0)ti=to.fields.length;
  to.fields.splice(ti,0,f);renderAll();scheduleSave();
}

function attachEditors(){
  canvas.querySelectorAll("[data-editvalue]").forEach(el=>el.addEventListener("change",()=>saveFieldValue(el.dataset.editvalue,el.value)));
  canvas.querySelectorAll("[data-editcheck]").forEach(el=>el.addEventListener("change",()=>saveFieldValue(el.dataset.editcheck,el.checked)));
  canvas.querySelectorAll("[data-choicefield]").forEach(el=>el.addEventListener("click",()=>saveFieldValue(el.dataset.choicefield,el.dataset.choice)));
  canvas.querySelectorAll("[data-multiedit]").forEach(el=>el.addEventListener("click",()=>editMultiValue(el.dataset.multiedit)));
}
async function saveFieldValue(fieldId,value){
  const f=findField(fieldId),rec=currentRecord();if(!f||!f.columnId||!rec)return;
  rec[f.columnId]=value;renderCanvas();
  if(!state.inGrist){toastMsg("Demo value updated");return}
  try{
    await grist.docApi.applyUserActions([["UpdateRecord",state.config.tableId,Number(rec.id),{[f.columnId]:value}]]);
    toastMsg("Saved to Grist");
  }catch(e){console.error(e);toastMsg("Could not save value")}
}
async function editMultiValue(id){
  const f=findField(id),rec=currentRecord();if(!f||!rec)return;
  const current=decodeList(rec[f.columnId]).map(String);
  const labels=(f.choices||[]).map(c=>c.label);
  const answer=prompt("Enter selected values separated by commas",current.join(", "));
  if(answer===null)return;
  const vals=answer.split(",").map(x=>x.trim()).filter(Boolean);
  await saveFieldValue(id,encodeList(vals));
}

async function addRecord(){
  if(!state.config.tableId)return;
  const title=prompt("Name for the new record","");
  if(title===null)return;
  const values={};
  if(state.config.titleField)values[state.config.titleField]=title;
  if(!state.inGrist){
    const id=Math.max(0,...state.rows.map(r=>Number(r.id)||0))+1;state.rows.push({id,...values});state.config.selectedRecordId=id;renderAll();return;
  }
  try{
    const res=await grist.docApi.applyUserActions([["AddRecord",state.config.tableId,null,values]]);
    await loadTable(state.config.tableId);
    state.config.selectedRecordId=state.rows[state.rows.length-1]?.id??state.config.selectedRecordId;
    renderAll();scheduleSave();toastMsg("Record added");
  }catch(e){console.error(e);toastMsg("Could not add record")}
}

      x=`<div class="hr"></div><div class="form-grid"><label class="label">Linked table</label><select class="sel" id="fmRefTable">${tableOptions(f?.refTable||"")}</select></div>`;
    }else if(type==="staticText"){
      x=`<div class="hr"></div><label class="label">Text</label><textarea class="area" id="fmStaticText">${esc(f?.staticText||"")}</textarea>`;
    }else if(type==="button"){
      x=`<div class="hr"></div><div class="form-grid"><label class="label">Button text</label><input class="inp" id="fmButtonLabel" value="${esc(f?.buttonLabel||"Open")}">
      <label class="label">URL column</label><select class="sel" id="fmUrlColumn">${columnOptions(f?.urlColumn||"")}</select>
      <label class="label">Style</label><select class="sel" id="fmButtonStyle"><option value="white">White</option><option value="red" ${f?.buttonStyle==="red"?"selected":""}>Red</option><option value="blue" ${f?.buttonStyle==="blue"?"selected":""}>Blue</option><option value="dark" ${f?.buttonStyle==="dark"?"selected":""}>Dark</option></select></div>`;
    }
    $("#fmExtra").innerHTML=x;
    if($("#addChoiceOpt"))$("#addChoiceOpt").onclick=()=>{$("#choiceEditor").insertAdjacentHTML("beforeend",choiceEditRow({label:"New option",color:COLORS[$("#choiceEditor").children.length%COLORS.length]},$("#choiceEditor").children.length));bindChoiceDelete()};
    bindChoiceDelete();
  };
  $("#fmType").onchange=()=>{
    if(!$("#fmLabel").value)$("#fmLabel").value=TYPE_DEFS[$("#fmType").value].label;
    if($("#fmSource").value==="new")$("#fmNewCol").value=safeId($("#fmLabel").value);
    renderExtra();
  };
  $("#fmSource").onchange=renderExtra;
  $("#fmLabel").oninput=()=>{if($("#fmSource").value==="new")$("#fmNewCol").value=safeId($("#fmLabel").value)};
  renderExtra();openModal("fieldModal");
}
function choiceEditRow(c,i){
  return `<div class="choice-edit-row"><span class="color-dot" style="background:${COLOR_HEX[c.color||COLORS[i%COLORS.length]].fill}"></span>
    <input class="inp" data-choice-label value="${esc(c.label||"")}"><select class="sel" data-choice-color style="display:none">${COLORS.map(x=>`<option ${x===(c.color||COLORS[i%COLORS.length])?"selected":""}>${x}</option>`).join("")}</select>
    <button class="icon-btn" type="button" data-delchoice>×</button><input type="hidden" data-hidden-color value="${esc(c.color||COLORS[i%COLORS.length])}"></div>`;
}
function bindChoiceDelete(){
  document.querySelectorAll("[data-delchoice]").forEach(b=>b.onclick=()=>b.closest(".choice-edit-row").remove());
  document.querySelectorAll(".color-dot").forEach(dot=>dot.onclick=()=>{
    const row=dot.closest(".choice-edit-row"),hidden=row.querySelector("[data-hidden-color]");
    const i=(COLORS.indexOf(hidden.value)+1)%COLORS.length;hidden.value=COLORS[i];dot.style.background=COLOR_HEX[COLORS[i]].fill;
  });
}
function findFieldSection(fid){
  for(const t of state.config.tabs)for(const s of t.sections)if(s.fields.some(f=>f.id===fid))return s.id;return null;
}
function collectChoices(){
  return [...document.querySelectorAll(".choice-edit-row")].map(r=>({label:r.querySelector("[data-choice-label]").value.trim(),color:r.querySelector("[data-hidden-color]").value})).filter(x=>x.label);
}
function widgetOptionsFor(type,choices){
  if(type!=="singleSelect"&&type!=="multiSelect")return undefined;
  const choiceOptions={};
  choices.forEach(c=>{const h=COLOR_HEX[c.color]||COLOR_HEX.gray;choiceOptions[c.label]={fillColor:h.fill,textColor:h.text}});
  return JSON.stringify({choices:choices.map(c=>c.label),choiceOptions});
}
async function createColumn(label,colId,type,choices,refTable){
  const def=TYPE_DEFS[type];if(!def?.grist)return null;
  let gristType=def.grist;
  if(type==="reference")gristType="Ref:"+(refTable||"Table1");
  if(type==="referenceList")gristType="RefList:"+(refTable||"Table1");
  const info={type:gristType,isFormula:false,label};
  const wo=widgetOptionsFor(type,choices);if(wo)info.widgetOptions=wo;
  if(!state.inGrist){
    let actual=colId,i=2;while(state.columns.includes(actual))actual=colId+"_"+i++;
    state.columns.push(actual);state.rows.forEach(r=>r[actual]=null);return actual;
  }
  try{
    const result=await grist.docApi.applyUserActions([["AddColumn",state.config.tableId,colId,info]]);
    await loadTable(state.config.tableId);
    if(state.columns.includes(colId))return colId;
    const normalized=safeId(colId);
    return state.columns.find(c=>safeId(c)===normalized)||state.columns[state.columns.length-1];
  }catch(e){console.error(e);throw e}
}
$("#fieldSaveBtn").onclick=async()=>{
  const type=$("#fmType").value,label=$("#fmLabel").value.trim()||TYPE_DEFS[type].label,source=$("#fmSource").value;
  let colId=source==="existing"?$("#fmColumn").value:"";
  const choices=(type==="singleSelect"||type==="multiSelect")?collectChoices():[];
  const refTable=$("#fmRefTable")?.value||"";
  if(source==="new"){
    if(!state.config.tableId)return toastMsg("Choose a data table first");
    colId=safeId($("#fmNewCol").value||label);
    try{colId=await createColumn(label,colId,type,choices,refTable);toastMsg("Grist column created")}
    catch(e){return toastMsg("Could not create Grist column")}
  }
  const base={
    label,type,columnId:colId||"",span:Number($("#fmSpan").value),showLabel:$("#fmShowLabel").checked,
    choices,refTable,
    staticText:$("#fmStaticText")?.value||"",
    buttonLabel:$("#fmButtonLabel")?.value||"",
    urlColumn:$("#fmUrlColumn")?.value||"",
    buttonStyle:$("#fmButtonStyle")?.value||"white"
  };
  if(state.editField){
    Object.assign(findField(state.editField),base);
  }else{
    const sec=findSection(state.pendingFieldSection);
    if(!sec)return toastMsg("Section not found");
    sec.fields.push({id:uid(),...base});
  }
  closeModal("fieldModal");state.editField=null;renderAll();scheduleSave();
};
function removeField(id){
  if(!confirm("Remove this field from the interface? The Grist column and data will remain."))return;
  for(const t of state.config.tabs)for(const s of t.sections)s.fields=s.fields.filter(f=>f.id!==id);
  state.selected={kind:null,id:null};renderAll();scheduleSave();
}

function openDataModal(){
  $("#dataModalBody").innerHTML=`
    <div class="notice">Choose an existing table, or create a completely new Grist table. The interface layout itself is stored in this widget's options.</div>
    <div class="hr"></div>
    <div class="form-grid">
      <label class="label">Existing table</label><select class="sel" id="dmTable">${tableOptions(state.config.tableId)}</select>
      <div></div><button class="btn btn-primary" id="useTableBtn">Use selected table</button>
    </div>
    <div class="hr"></div>
    <div class="side-title">Create a new data table</div>
    <div class="form-grid">
      <label class="label">Table name</label><input class="inp" id="newTableName" placeholder="Brands">
      <label class="label">First field</label><input class="inp" id="newTableField" value="Name">
      <div></div><button class="btn" id="createTableBtn">＋ Create table</button>
    </div>
    ${state.inGrist?"":`<div class="notice" style="margin-top:15px">Standalone mode cannot create a real Grist table. It is intended only for previewing the builder.</div>`}
  `;
  openModal("dataModal");
  $("#useTableBtn").onclick=async()=>{
    const t=$("#dmTable").value;if(!t)return;
    state.config.tableId=t;await loadTable(t);
    if(!state.config.titleField||!state.columns.includes(state.config.titleField))state.config.titleField=state.columns[0]||"";
    closeModal("dataModal");renderAll();scheduleSave();
  };
  $("#createTableBtn").onclick=()=>createTable();
}
$("#dataBtn").onclick=()=>openDataModal();

async function createTable(){
  const name=safeId($("#newTableName").value||"New_Table"),label=$("#newTableField").value.trim()||"Name",col=safeId(label);
  if(!state.inGrist){
    state.config.tableId=name;state.tables=[name];state.columns=[col];state.rows=[];state.config.titleField=col;closeModal("dataModal");renderAll();return;
  }
  try{
    await grist.docApi.applyUserActions([["AddTable",name,[{id:col,type:"Text",isFormula:false,label}]]]);
    state.tables=(await grist.docApi.listTables()).filter(t=>!String(t).startsWith("_"));
    const actual=state.tables.includes(name)?name:state.tables.find(t=>safeId(t)===name)||state.tables[state.tables.length-1];
    state.config.tableId=actual;await loadTable(actual);state.config.titleField=state.columns.includes(col)?col:state.columns[0]||"";
    closeModal("dataModal");renderAll();scheduleSave();toastMsg("Grist table created");
  }catch(e){console.error(e);toastMsg("Could not create table")}
}

$("#headerButtonSave").onclick=()=>{
  state.config.headerButtons.push({id:uid(),label:$("#headerButtonLabel").value||"Open",urlColumn:$("#headerButtonColumn").value,style:$("#headerButtonStyle").value});
  closeModal("buttonModal");renderAll();scheduleSave();
};

init();
})();
</script>
</body>
</html>
