      img.alt = imgInfo.name || 'Excel image';
      img.style.cssText = `
        display:block; max-width:260px; max-height:190px;
        width:auto; height:auto; margin:6px auto;
        object-fit:contain; box-shadow:0 1px 4px rgba(0,0,0,.18);
      `;
      cell.style.whiteSpace = 'normal';
      cell.style.overflow = 'visible';
      cell.style.maxWidth = 'none';
      cell.appendChild(img);
    });

    if (unplaced.length) {
      const gallery = document.createElement('div');
      gallery.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#fafafa;border-top:1px solid #ddd;';
      unplaced.forEach(imgInfo => {
        const img = document.createElement('img');
        img.src = imgInfo.url;
        img.alt = imgInfo.name || 'Excel image';
        img.style.cssText = 'max-width:260px;max-height:190px;object-fit:contain;border:1px solid #ddd;background:white;';
        gallery.appendChild(img);
      });
      sheetDiv.appendChild(gallery);
    }
  });
}

// Рендеринг таблицы Excel с полной обработкой стилей и поддержкой объединения ячеек
async function renderExcel() {
  const container = document.getElementById('viewer-container');
  const file = currentFiles[currentIndex];
  const renderFileId = file ? file.id : null;
  container.style.background = '#ffffff'; 
  const currentFontSize = Math.round(13 * pdfScale);

  try {
    // ВАЖНО: Читаем книгу с включенными флагами cellStyles и bookStyles
    const workbook = XLSX.read(currentBlobData, { 
      type: 'array',
      cellNF: true,      
      cellStyles: true,  
      bookStyles: true,
      cellText: true,
      bookFiles: true
    });
    
    let htmlContent = `<div class="excel-table-container" style="max-width: 95%; margin: 0 auto; padding: 20px; font-size: ${currentFontSize}px;">`;
    htmlContent += `<h3 style="border-bottom: 1px solid #ddd; padding-bottom: 10px; color: #2c3e50; font-family: Arial; font-size: 1.5em; margin-top:0;">${file.name}</h3>`;
    htmlContent += `<div style="display: flex; gap: 4px; margin-bottom: 15px; border-bottom: 2px solid #bdc3c7; padding-bottom: 0; overflow-x: auto; font-family: Arial, sans-serif;">`;
    
    workbook.SheetNames.forEach((sheetName, index) => {
      const isActive = index === activeExcelSheetIndex;
      htmlContent += `<button class="excel-tab-btn" data-index="${index}" style="padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; background: ${isActive ? '#2c3e50' : '#e5e7e9'}; color: ${isActive ? '#fff' : '#333'}; font-weight: bold; font-size: 12px; white-space: nowrap; outline: none; transition: all 0.2s;">${sheetName}</button>`;
    });
    htmlContent += `</div>`;

    workbook.SheetNames.forEach((sheetName, index) => {
      const worksheet = workbook.Sheets[sheetName];
      const isActive = index === activeExcelSheetIndex;
      
      if (!worksheet['!ref']) {
        htmlContent += `<div class="excel-sheet-content" id="excel-sheet-${index}" style="display: ${isActive ? 'block' : 'none'}; padding:20px; color:#999;">Пустой лист</div>`;
        return;
      }

      const range = XLSX.utils.decode_range(worksheet['!ref']);
      
      // ПОДГОТОВКА СЕТКИ ОБЪЕДИНЕНИЙ (MERGES)
      const merges = worksheet['!merges'] || [];
      // Создаем карту заблокированных/скрытых ячеек, которые перекрыты объединением
      const mergeMap = {}; 
      // Карта для хранения colspan/rowspan для главных (левых верхних) ячеек объединения
      const mergeAttrs = {}; 

      merges.forEach(merge => {
        const startRow = merge.s.r;
        const startCol = merge.s.c;
        const endRow = merge.e.r;
        const endCol = merge.e.c;

        // Для главной ячейки рассчитываем rowspan и colspan
        const keyMain = `${startRow}_${startCol}`;
        mergeAttrs[keyMain] = {
          rowspan: endRow - startRow + 1,
          colspan: endCol - startCol + 1
        };

        // Все остальные ячейки в этом диапазоне помечаем как скрытые
        for (let r = startRow; r <= endRow; r++) {
          for (let c = startCol; c <= endCol; c++) {
            if (r === startRow && c === startCol) continue; // Главную ячейку не скрываем
            mergeMap[`${r}_${c}`] = true;
          }
        }
      });

      let customTableHtml = '<table>';
      
      for (let r = range.s.r; r <= range.e.r; ++r) {
        customTableHtml += '<tr>';
        for (let c = range.s.c; c <= range.e.c; ++c) {
          const cellCoordKey = `${r}_${c}`;
          
          // Если ячейка находится внутри диапазона объединения и не является главной — пропускаем её рендер
          if (mergeMap[cellCoordKey]) {
            continue;
          }

          const cellAddress = XLSX.utils.encode_cell({ r: r, c: c });
          const cell = worksheet[cellAddress];
          const cellTag = (r === range.s.r) ? 'th' : 'td';
          
          // Получаем rowspan и colspan, если ячейка является началом объединения
          let mergeStringAttr = '';
          if (mergeAttrs[cellCoordKey]) {
            const m = mergeAttrs[cellCoordKey];
            if (m.rowspan > 1) mergeStringAttr += ` rowspan="${m.rowspan}"`;
            if (m.colspan > 1) mergeStringAttr += ` colspan="${m.colspan}"`;
          }

          if (!cell) {
            customTableHtml += `<${cellTag}${mergeStringAttr} data-r="${r}" data-c="${c}"></${cellTag}>`;
            continue;
          }
          
          const displayValue = cell.w !== undefined ? cell.w : (cell.v !== undefined ? cell.v : '');
          let inlineStyles = [];
          
          // Применяем стили из метаданных ячейки
          if (cell.s) {
            // Фон (заливка)
            if (cell.s.fill) {
              const fg = cell.s.fill.fgColor;
              const bg = cell.s.fill.bgColor;
              let bgHex = parseExcelColor(fg || bg);
              if (bgHex && bgHex !== "FFFFFF" && bgHex !== "000000") {
                inlineStyles.push(`background-color: #${bgHex} !important`);
              }
            }
            
            // Текст (шрифты, жирность, цвет)
            if (cell.s.font) {
              let fontHex = parseExcelColor(cell.s.font.color);
              if (fontHex && fontHex !== "000000") {
                inlineStyles.push(`color: #${fontHex} !important`);
              }
              if (cell.s.font.bold) inlineStyles.push('font-weight: bold');
              if (cell.s.font.italic) inlineStyles.push('font-style: italic');
            }
            
            // Выравнивание текста
            if (cell.s.alignment) {
              if (cell.s.alignment.horizontal) {
                let align = cell.s.alignment.horizontal;
                inlineStyles.push(`text-align: ${align === 'center' ? 'center' : (align === 'right' ? 'right' : 'left')}`);
              }
              if (cell.s.alignment.vertical) {
                let valign = cell.s.alignment.vertical;
                inlineStyles.push(`vertical-align: ${valign === 'center' ? 'middle' : (valign === 'top' ? 'top' : 'bottom')}`);
              }
            }
          }
          
          const styleAttr = inlineStyles.length > 0 ? ` style="${inlineStyles.join('; ')}"` : '';
          customTableHtml += `<${cellTag}${mergeStringAttr}${styleAttr} data-r="${r}" data-c="${c}">${displayValue}</${cellTag}>`;
        }
        customTableHtml += '</tr>';
      }
      customTableHtml += '</table>';
      
      htmlContent += `<div class="excel-sheet-content" id="excel-sheet-${index}" style="display: ${isActive ? 'block' : 'none'}; overflow: auto; max-width: 100%; max-height: calc(100vh - 180px); border: 1px solid #e0e0e0; border-radius:4px;">${customTableHtml}</div>`;
    });

    htmlContent += `</div>`;
    container.innerHTML = htmlContent;

    const embeddedImages = await extractExcelEmbeddedImages(currentBlobData, workbook);
    if (!currentFiles[currentIndex] || currentFiles[currentIndex].id !== renderFileId) return;
    renderExcelEmbeddedImages(embeddedImages, container, workbook);

    const tables = container.querySelectorAll('.excel-table-container table');
    tables.forEach(table => {
      const rows = table.querySelectorAll('tr');
      if (rows.length === 0) return;

      rows.forEach((row, rowIndex) => {
        const isHeader = rowIndex === 0;
        const lockCell = document.createElement(isHeader ? 'th' : 'td');
        lockCell.className = 'row-lock-cell';
        lockCell.title = isHeader ? 'Закрепить верхнюю строку' : 'Закрепить строки до этой включительно';
        
        const lockIcon = document.createElement('span');
        lockIcon.className = 'row-lock-icon';
        lockIcon.innerHTML = '🔒';
        lockCell.appendChild(lockIcon);
        row.insertBefore(lockCell, row.firstChild);

        lockCell.addEventListener('click', function(e) {
          e.stopPropagation();
          const isCurrentlyLocked = lockIcon.classList.contains('locked');
          table.querySelectorAll('.row-lock-icon').forEach(icon => icon.classList.remove('locked'));
          table.querySelectorAll('tr').forEach(r => {
            r.classList.remove('frozen-row');
            r.querySelectorAll('td, th').forEach(cell => cell.style.top = '');
          });

          if (!isCurrentlyLocked) {
            let runningTop = 0;
            for (let i = 0; i <= rowIndex; i++) {
              const targetRow = rows[i];
              targetRow.classList.add('frozen-row');
              targetRow.querySelectorAll('td, th').forEach(cell => { cell.style.top = runningTop + 'px'; });
              if (i === rowIndex) targetRow.querySelector('.row-lock-icon').classList.add('locked');
              runningTop += targetRow.offsetHeight;
            }
          }
        });

        if (isHeader) {
          const headers = row.querySelectorAll('td, th');
          headers.forEach((header, colIndex) => {
            if (colIndex === 0) return; 
            header.style.position = 'relative';

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'col-toggle-btn';
            toggleBtn.innerText = '↔';
            toggleBtn.title = 'Переключить ширину';
            
            toggleBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              const isBtnActive = this.classList.toggle('active');
              rows.forEach(r => {
                const cells = r.querySelectorAll('td, th');
                if (cells[colIndex]) {
                  if (isBtnActive) cells[colIndex].classList.add('expanded-col');
                  else cells[colIndex].classList.remove('expanded-col');
                }
              });
            });
            header.appendChild(toggleBtn);
          });
        }
      });
    });

    const tabs = container.querySelectorAll('.excel-tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', function() {
        const idx = parseInt(this.getAttribute('data-index'), 10);
        activeExcelSheetIndex = idx; 
        container.querySelectorAll('.excel-sheet-content').forEach(c => c.style.display = 'none');
        container.querySelectorAll('.excel-tab-btn').forEach(t => { t.style.background = '#e5e7e9'; t.style.color = '#333'; });
        document.getElementById(`excel-sheet-${idx}`).style.display = 'block';
        this.style.background = '#2c3e50';
        this.style.color = '#fff';
      });
    });
  } catch (err) {
    container.innerHTML = `<div style="padding: 40px; color: #ff6b6b; text-align: center;">Не удалось прочитать Excel: ${err.message}</div>`;
  }
}

function renderText() {
  const container = document.getElementById('viewer-container');
  const file = currentFiles[currentIndex];
  container.style.background = '#ffffff'; 
  const currentFontSize = Math.round(14 * pdfScale);

  try {
    let textString = '';
    try {
      const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
      textString = utf8Decoder.decode(currentBlobData);
    } catch (e) {
      const win1251Decoder = new TextDecoder('windows-1251');
      textString = win1251Decoder.decode(currentBlobData);
    }

    const escapeHTML = (str) => str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
    );

    container.innerHTML = `
      <div style="max-width: 95%; margin: 0 auto; padding: 20px; box-sizing: border-box;">
        <h3 style="border-bottom: 1px solid #ddd; padding-bottom: 10px; color: #2c3e50; font-family: Arial; font-size: 1.4em; margin-top:0;">${file.name}</h3>
        <pre style="
          white-space: pre-wrap; 
          word-wrap: break-word; 
          font-family: Consolas, 'Courier New', monospace; 
          font-size: ${currentFontSize}px; 
          color: #333;
          background: #f9f9f9;
          padding: 15px;
          border: 1px solid #eee;
          border-radius: 4px;
        ">${escapeHTML(textString)}</pre>
      </div>`;
  } catch (err) {
    container.innerHTML = `<div style="padding: 40px; color: #ff6b6b; text-align: center;">Ошибка чтения текстового файла: ${err.message}</div>`;
  }
}

async function renderPdf(savedScrollRatio = null) {
  const container = document.getElementById('viewer-container');
  if (!currentPdf) return;
  
  container.style.background = '#525659'; 
  
  const floatingControls = document.getElementById('floating-controls-container');
  floatingControls.innerHTML = `
    <button class="reset-zoom-floating" id="pdf-fit-width-btn">↔ По ширине</button>
    <button class="reset-zoom-floating" id="pdf-fit-height-btn">↕ По высоте страницы</button>
  `;
  
  document.getElementById('pdf-fit-width-btn').addEventListener('click', async () => {
    try {
      const firstPage = await currentPdf.getPage(1);
      const unscaledViewport = firstPage.getViewport({ scale: 1.0 });
      const fitScale = (container.clientWidth - 40) / unscaledViewport.width;
      pdfScale = fitScale / autoScaleFactor;
      rememberCurrentZoom();
      applyZoom();
    } catch (e) { console.error(e); }
  });

  document.getElementById('pdf-fit-height-btn').addEventListener('click', async () => {
    try {
      const firstPage = await currentPdf.getPage(1);
      const unscaledViewport = firstPage.getViewport({ scale: 1.0 });
      const fitScale = (container.clientHeight - 40) / unscaledViewport.height;
      pdfScale = fitScale / autoScaleFactor;
      rememberCurrentZoom();
      applyZoom();
    } catch (e) { console.error(e); }
  });

  container.innerHTML = ''; 
  const finalScale = autoScaleFactor * pdfScale;
  
  // Перебираем ВСЕ страницы документа
  for (let pageNum = 1; pageNum <= currentPdf.numPages; pageNum++) {
    try {
      const page = await currentPdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: finalScale });
      
      const pageWrapper = document.createElement('div');
      pageWrapper.style.position = 'relative';
      pageWrapper.style.margin = '0 auto 20px auto';
      pageWrapper.style.width = viewport.width + 'px';
      pageWrapper.style.height = viewport.height + 'px';
      pageWrapper.style.boxShadow = '0 4px 8px rgba(0,0,0,0.3)';
      
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; 
      canvas.height = viewport.height;
      pageWrapper.appendChild(canvas);
      
      const textLayerDiv = document.createElement('div');
      textLayerDiv.setAttribute('class', 'textLayer');
      textLayerDiv.style.width = viewport.width + 'px'; 
      textLayerDiv.style.height = viewport.height + 'px';
      textLayerDiv.style.position = 'absolute'; 
      textLayerDiv.style.top = '0'; 
      textLayerDiv.style.left = '0';
      pageWrapper.appendChild(textLayerDiv);
      
      const annotationLayerDiv = document.createElement('div');
      annotationLayerDiv.setAttribute('class', 'annotationLayer');
      annotationLayerDiv.style.width = viewport.width + 'px'; 
      annotationLayerDiv.style.height = viewport.height + 'px';
      annotationLayerDiv.style.position = 'absolute'; 
      annotationLayerDiv.style.top = '0'; 
      annotationLayerDiv.style.left = '0';
      pageWrapper.appendChild(annotationLayerDiv);
      
      container.appendChild(pageWrapper);
      
      // 1. Рендерим сам Canvas страницы
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
      
      // 2. Безопасно рендерим текстовый слой (для выделения текста)
      try {
        const textContent = await page.getTextContent();
        await pdfjsLib.renderTextLayer({ 
          textContent: textContent, 
          container: textLayerDiv, 
          viewport: viewport, 
          textDivs: [] 
        }).promise;
      } catch (textErr) {
        console.warn(`Текстовый слой не загружен для страницы ${pageNum}:`, textErr);
      }
      
      // 3. Безопасно рендерим слой аннотаций (ссылки, формы)
      try {
        const annotations = await page.getAnnotations();
        if (annotations && annotations.length > 0) {
          await pdfjsLib.AnnotationLayer.render({
            viewport: viewport.clone({ dontFlip: true }),
            div: annotationLayerDiv,
            annotations: annotations,
            page: page,
            linkService: {
              baseUrl: '',
              getAnchorUrl: (anchor) => anchor,
              getDestinationHash: (dest) => '',
              getDisplayZoneSecure: () => false,
              navigateTo: (dest) => {},
              executeNamedAction: (action) => {}
            },
            downloadManager: null
          }).promise;
        }
      } catch (annotErr) {
        console.warn(`Слой аннотаций не загружен для страницы ${pageNum}:`, annotErr);
      }

    } catch (pageErr) {
      console.error(`Ошибка при обработке страницы ${pageNum}:`, pageErr);
      // Создаем заглушку, чтобы пользователь видел, что страница повреждена, но остальные грузились
      const errorBlock = document.createElement('div');
      errorBlock.style.margin = '0 auto 20px auto';
      errorBlock.style.width = '100%';
      errorBlock.style.maxWidth = '500px';
      errorBlock.style.background = '#fff';
      errorBlock.style.padding = '20px';
      errorBlock.style.color = '#c0392b';
      errorBlock.style.textAlign = 'center';
      errorBlock.innerText = `⚠️ Ошибка отображения страницы ${pageNum}`;
      container.appendChild(errorBlock);
    }
  }

  if (savedScrollRatio !== null) {
    container.scrollTop = savedScrollRatio * (container.scrollHeight - container.clientHeight);
  }
}

function changeZoom(delta) {
  let newScale = pdfScale + delta;
  if (newScale >= 0.2 && newScale <= 6.0) {
    pdfScale = Math.round(newScale * 10) / 10;
    rememberCurrentZoom();
    applyZoom();
  }
}

function applyZoom() {
  document.getElementById('zoom-input').value = Math.round(pdfScale * 100) + '%';
  
  if (fileTypeMode === 1) {
    const imgEl = document.getElementById('viewed-image-el');
    if (imgEl) adjustWrapperSize(imgEl, pdfScale);
  } else if (fileTypeMode === 2) {
    renderWord(); 
  } else if (fileTypeMode === 3) {
    renderExcel(); 
  } else if (fileTypeMode === 5) {
    renderText();
  } else if (fileTypeMode === 4) {
    const container = document.getElementById('viewer-container');
    const scrollRange = container.scrollHeight - container.clientHeight;
    const currentRatio = scrollRange > 0 ? (container.scrollTop / scrollRange) : 0;
    
    renderPdf(currentRatio);
  }
}

// Глобальный drag & drop: можно бросать один или несколько файлов прямо на открытый документ.
document.addEventListener('dragover', (e) => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
    e.preventDefault();
  }
});
document.addEventListener('drop', (e) => {
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || files.length === 0) return;
  const dropZone = document.getElementById('drop-zone');
  if (dropZone && dropZone.contains(e.target)) return;
  e.preventDefault();
  handleUploadedFiles(files);
});
