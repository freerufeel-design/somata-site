<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Grist Kanban Reference List Fix</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f5f7;
            height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #kanban-board {
            display: flex;
            gap: 12px;
            flex-grow: 1;
            overflow-x: auto;
            align-items: flex-start;
            height: 100%;
            padding-bottom: 8px;
        }
        .kanban-column {
            background: #ebecf0;
            border-radius: 6px;
            width: 290px;
            min-width: 290px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .column-header {
            font-weight: bold;
            padding: 0 4px 12px 4px;
            font-size: 14px;
            color: #42526e;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            border-bottom: 2px solid #dfe1e6;
            margin-bottom: 10px;
        }
        .cards-container {
            overflow-y: auto;
            flex-grow: 1;
            display: flex !important;
            flex-direction: column !important;
            gap: 8px !important;
            min-height: 120px;
            padding: 4px;
            box-sizing: border-box;
        }
        .kanban-card {
            background: #fff;
            border-radius: 4px;
            padding: 12px;
            box-shadow: 0 1px 3px rgba(9, 30, 66, 0.25);
            cursor: grab;
            font-size: 13px;
            line-height: 1.4;
            color: #172b4d;
            border-left: 4px solid #0052cc;
            box-sizing: border-box;
            word-break: break-word;
            display: block !important;
            user-select: none;
        }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card.dragging { opacity: 0.3; border-left-color: #ff9800; }
        .cards-container.drag-over { 
            background: rgba(9, 30, 66, 0.08); 
            border-radius: 4px; 
        }
        .msg { padding: 20px; color: #6b778c; text-align: center; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div id="kanban-board">
    <div class="msg">Синхронизация списков связей Grist...</div>
</div>

<script>
    let currentTableId = null;
    let localRecords = [];

    // Жёстко заданные имена колонок по твоей структуре
    const COL_CATEGORY = 'Категории';  // Столбец с именами категорий (Группы)
    const COL_TECH = 'Технологии';      // Столбец-связь типа Reference List (Карточки)

    grist.ready({ requiredAccess: 'full' });

    grist.onOptions(function(options, interaction) {
        if (interaction && interaction.tableId) {
            currentTableId = interaction.tableId.replace(/_summary_.*$/, '').replace(/Summary.*$/, '');
        }
    });

    grist.onRecords(function(records) {
        localRecords = records;
        const board = document.getElementById('kanban-board');
        
        if (!records || records.length === 0) {
            board.innerHTML = `<div class="msg">Нет записей. Подключите виджет к таблице Категорий.</div>`;
            return;
        }

        board.innerHTML = '';

        records.forEach(rec => {
            // Имя категории для заголовка колонки
            const origCatName = rec[COL_CATEGORY] || '';
            const columnName = typeof origCatName === 'object' ? (origCatName.label || `ID: ${origCatName.id}`) : String(origCatName);
            
            if (!columnName.trim()) return;

            // Разбираем Reference List. Grist присылает его как массив объектов, либо как массив вида ['L', id1, id2]
            const rawTechs = rec[COL_TECH];
            let techObjects = [];

            if (Array.isArray(rawTechs)) {
                // Отфильтровываем сервисный маркер Grist 'L' и берем только валидные объекты/ID
                techObjects = rawTechs.filter(item => item !== 'L');
            }

            // Генерируем колонку-категорию
            const colEl = document.createElement('div');
            colEl.className = 'kanban-column';
            colEl.innerHTML = `
                <div class="column-header" title="${columnName}">${columnName} (${techObjects.length})</div>
                <div class="cards-container" data-row-id="${rec.id}"></div>
            `;
            
            const container = colEl.querySelector('.cards-container');

            // Рендерим каждую связанную технологию как отдельную карточку
            techObjects.forEach(tech => {
                if (!tech) return;
                
                // Вытаскиваем ID технологии и её текстовое имя (label)
                const techId = typeof tech === 'object' ? tech.id : tech;
                const techName = typeof tech === 'object' ? (tech.label || `Технология #${tech.id}`) : `ID: ${tech}`;

                const card = document.createElement('div');
                card.className = 'kanban-card';
                card.draggable = true;
                card.innerText = techName;
                
                // Сохраняем ID технологии и ID текущей категории (строки-родителя)
                card.dataset.techId = techId;
                card.dataset.sourceRowId = rec.id;
                
                card.addEventListener('dragstart', () => card.classList.add('dragging'));
                card.addEventListener('dragend', () => card.classList.remove('dragging'));
                
                container.appendChild(card);
            });

            // Реализация Drag & Drop
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                container.classList.add('drag-over');
            });
            container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
            
            container.addEventListener('drop', async (e) => {
                e.preventDefault();
                container.classList.remove('drag-over');
                
                const draggingCard = document.querySelector('.dragging');
                if (!draggingCard) return;

                const sourceRowId = parseInt(draggingCard.dataset.sourceRowId, 10);
                const targetRowId = parseInt(container.dataset.rowId, 10);
                const techId = parseInt(draggingCard.dataset.techId, 10);

                // Если бросили в ту же колонку, ничего не делаем
                if (sourceRowId === targetRowId) return;

                const sourceRecord = localRecords.find(r => r.id === sourceRowId);
                const targetRecord = localRecords.find(r => r.id === targetRowId);
                if (!sourceRecord || !targetRecord) return;

                // Функция сборки чистого массива числовых ID для Grist Reference List (формат ['L', id, id])
                const cleanIds = (rawVal) => {
                    if (!Array.isArray(rawVal)) return [];
                    return rawVal
                        .filter(item => item !== 'L' && item)
                        .map(item => typeof item === 'object' ? item.id : parseInt(item, 10));
                };

                // 1. УДАЛЯЕМ ID технологии из списка старой категории
                const sourceIds = cleanIds(sourceRecord[COL_TECH]).filter(id => id !== techId);
                const newSourceValue = ['L', ...sourceIds];

                // 2. ДОБАВЛЯЕМ ID технологии в список новой категории
                const targetIds = cleanIds(targetRecord[COL_TECH]);
                if (!targetIds.includes(techId)) {
                    targetIds.push(techId);
                }
                const newTargetValue = ['L', ...targetIds];

                try {
                    // Перезаписываем массивы связей в обеих строках таблицы Категорий
                    await grist.docApi.applyUserActions([
                        ["UpdateRecord", currentTableId, sourceRowId, { [COL_TECH]: newSourceValue }],
                        ["UpdateRecord", currentTableId, targetRowId, { [COL_TECH]: newTargetValue }]
                    ]);
                } catch (err) {
                    console.error("Ошибка обновления связей в Grist:", err);
                }
            });

            board.appendChild(colEl);
        });
    });
</script>
</body>
</html>
