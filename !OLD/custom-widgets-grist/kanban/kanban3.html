<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Grist Kanban Strict A B Reference List Sequential</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body {
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f5f7;
            height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #kanban-board {
            display: flex;
            gap: 12px;
            flex-grow: 1;
            overflow-x: auto;
            align-items: flex-start;
            height: 100%;
            padding-bottom: 8px;
        }
        .kanban-column {
            background: #ebecf0;
            border-radius: 6px;
            width: 290px;
            min-width: 290px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .column-header {
            font-weight: bold;
            padding: 0 4px 12px 4px;
            font-size: 14px;
            color: #42526e;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            border-bottom: 2px solid #dfe1e6;
            margin-bottom: 10px;
        }
        .cards-container {
            overflow-y: auto;
            flex-grow: 1;
            display: flex !important;
            flex-direction: column !important;
            gap: 8px !important;
            min-height: 120px;
            padding: 4px;
            box-sizing: border-box;
        }
        .kanban-card {
            background: #fff;
            border-radius: 4px;
            padding: 12px;
            box-shadow: 0 1px 3px rgba(9, 30, 66, 0.25);
            cursor: grab;
            font-size: 13px;
            line-height: 1.4;
            color: #172b4d;
            border-left: 4px solid #0052cc;
            box-sizing: border-box;
            word-break: break-word;
            display: block !important;
            user-select: none;
        }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card.dragging { opacity: 0.3; border-left-color: #ff9800; }
        .cards-container.drag-over { 
            background: rgba(9, 30, 66, 0.08); 
            border-radius: 4px; 
        }
        .msg { padding: 20px; color: #6b778c; text-align: center; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div id="kanban-board">
    <div class="msg">Синхронизация данных...</div>
</div>

<script>
    let currentTableId = null;
    let localRecords = [];

    const COL_CATEGORY = 'A';  
    const COL_TECH = 'B';      

    grist.ready({ requiredAccess: 'full' });

    grist.onOptions(function(options, interaction) {
        if (interaction && interaction.tableId) {
            currentTableId = interaction.tableId.replace(/_summary_.*$/, '').replace(/Summary.*$/, '');
        }
    });

    grist.onRecords(function(records) {
        localRecords = records;
        const board = document.getElementById('kanban-board');
        
        if (!records || records.length === 0) {
            board.innerHTML = `<div class="msg">Нет записей в таблице.</div>`;
            return;
        }

        board.innerHTML = '';

        records.forEach(rec => {
            const rawCat = rec[COL_CATEGORY];
            const columnName = rawCat && typeof rawCat === 'object' ? (rawCat.label || `ID: ${rawCat.id}`) : String(rawCat || '');
            
            if (!columnName.trim()) return; 

            const rawTechs = rec[COL_TECH];
            let techObjects = [];

            if (Array.isArray(rawTechs)) {
                techObjects = rawTechs.filter(item => item !== 'L');
            }

            const colEl = document.createElement('div');
            colEl.className = 'kanban-column';
            colEl.innerHTML = `
                <div class="column-header" title="${columnName}">${columnName} (${techObjects.length})</div>
                <div class="cards-container" data-row-id="${rec.id}"></div>
            `;
            
            const container = colEl.querySelector('.cards-container');

            techObjects.forEach(tech => {
                if (!tech) return;
                
                const techId = typeof tech === 'object' ? tech.id : tech;
                const techName = typeof tech === 'object' ? (tech.label || `Элемент #${tech.id}`) : `ID: ${tech}`;

                const card = document.createElement('div');
                card.className = 'kanban-card';
                card.draggable = true;
                card.innerText = techName;
                
                card.dataset.techId = techId;
                card.dataset.sourceRowId = rec.id;
                
                card.addEventListener('dragstart', () => card.classList.add('dragging'));
                card.addEventListener('dragend', () => card.classList.remove('dragging'));
                
                container.appendChild(card);
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                container.classList.add('drag-over');
            });
            container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
            
            container.addEventListener('drop', async (e) => {
                e.preventDefault();
                container.classList.remove('drag-over');
                
                const draggingCard = document.querySelector('.dragging');
                if (!draggingCard) return;

                const sourceRowId = parseInt(draggingCard.dataset.sourceRowId, 10);
                const targetRowId = parseInt(container.dataset.rowId, 10);
                const techId = parseInt(draggingCard.dataset.techId, 10);

                if (sourceRowId === targetRowId) return;

                const sourceRecord = localRecords.find(r => r.id === sourceRowId);
                const targetRecord = localRecords.find(r => r.id === targetRowId);
                if (!sourceRecord || !targetRecord) return;

                const getCleanIds = (val) => {
                    if (!Array.isArray(val)) return [];
                    return val
                        .filter(item => item !== 'L' && item)
                        .map(item => typeof item === 'object' ? item.id : parseInt(item, 10))
                        .filter(id => !isNaN(id));
                };

                // Подготовка данных для удаления
                const sourceIds = getCleanIds(sourceRecord[COL_TECH]).filter(id => id !== techId);
                const newSourceValue = ["C", "List", sourceIds];

                // Подготовка данных для добавления
                const targetIds = getCleanIds(targetRecord[COL_TECH]);
                if (!targetIds.includes(techId)) {
                    targetIds.push(techId);
                }
                const newTargetValue = ["C", "List", targetIds];

                try {
                    // ДЕЙСТВИЕ 1: Удаляем связь из отправной ячейки технологии
                    await grist.docApi.applyUserActions([
                        ["UpdateRecord", currentTableId, sourceRowId, { [COL_TECH]: newSourceValue }]
                    ]);
                    
                    // ДЕЙСТВИЕ 2: Строго после успешного удаления привязываем к новой ячейке технологии
                    await grist.docApi.applyUserActions([
                        ["UpdateRecord", currentTableId, targetRowId, { [COL_TECH]: newTargetValue }]
                    ]);
                } catch (err) {
                    console.error("Ошибка при пошаговом переносе связей в Grist:", err);
                }
            });

            board.appendChild(colEl);
        });
    });
</script>
</body>
</html>
