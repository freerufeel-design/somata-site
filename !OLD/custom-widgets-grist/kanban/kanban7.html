<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Grist Реляционный Канбан</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 10px;
      background-color: #f4f5f7;
      color: #172b4d;
    }
    .status-bar {
      background: #eef7ed;
      border: 1px solid #3dc13d;
      padding: 8px;
      margin-bottom: 15px;
      font-size: 12px;
      border-radius: 4px;
    }
    .debug-console {
      background: #1e1e1e;
      color: #00ff00;
      font-family: 'Courier New', Monaco, monospace;
      font-size: 11px;
      padding: 10px;
      margin-top: 20px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
    .debug-title {
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .kanban-board {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 20px;
      align-items: flex-start;
    }
    .kanban-column {
      background: #ebecf0;
      border-radius: 8px;
      width: 290px;
      flex-shrink: 0;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }
    .column-header {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .column-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }
    .column-count {
      background: #dfe1e6;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      color: #5e6c84;
    }
    .add-card-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px dashed #a5adba;
      background-color: #fff;
      color: #5e6c84;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
      outline: none;
    }
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .kanban-card {
      background: white;
      padding: 10px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(9, 30, 66, 0.2);
      font-size: 13.5px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-text { word-break: break-word; }
    .delete-card-btn {
      background: none;
      border: none;
      color: #a5adba;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      border-radius: 3px;
    }
    .delete-card-btn:hover {
      background-color: #ffebe6;
      color: #de350b;
    }
    .empty-board { color: #8993a4; font-style: italic; padding: 20px; }
  </style>
</head>
<body>

  <div id="status-message" class="status-bar">Синхронизация реляционных данных Grist...</div>

  <div class="kanban-board" id="kanban-board">
    <div class="empty-board">Ожидание данных...</div>
  </div>

  <div class="debug-console">
    <div class="debug-title">🔄 Контроль реляционных связей (Лог):</div>
    <div id="debug-log">Инициализация виджета...</div>
  </div>

  <script>
    grist.ready({
      requiredAccess: 'full', 
      columns: [
        { name: 'group', title: 'Группировка (Колонки)', type: 'Any' },
        { name: 'card', title: 'Содержимое (Карточки/Связи)', type: 'Any' }
      ]
    });

    let globalOptions = [];      
    let localRecords = [];       
    let mappingIds = {};         

    function logStep(message, isError = false) {
      const logDiv = document.getElementById('debug-log');
      const time = new Date().toLocaleTimeString();
      const style = isError ? "color: #ff4d4d; font-weight: bold;" : "";
      console.log(`[${time}] ${message}`);
      logDiv.innerHTML += `<div style="${style}">[${time}] ${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function normalizeGristData(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      const keys = Object.keys(data);
      let rowCount = 0;
      for (let key of keys) { if (Array.isArray(data[key])) { rowCount = data[key].length; break; } }
      const rows = [];
      for (let i = 0; i < rowCount; i++) {
        const row = {};
        for (let key of keys) { if (Array.isArray(data[key])) row[key] = data[key][i]; }
        rows.push(row);
      }
      return rows;
    }

    function getRecordLabel(row) {
      if (!row) return '';
      const keys = Object.keys(row);
      const bestKey = keys.find(k => ['label', 'name', 'title', 'наименование', 'технология', 'название'].includes(k.toLowerCase())) || keys.find(k => k !== 'id');
      return bestKey ? String(row[bestKey]) : String(row.id);
    }

    grist.onRecords(async (records, mappings) => {
      const statusDiv = document.getElementById('status-message');
      const boardContainer = document.getElementById('kanban-board');
      
      if (!mappings || !mappings.group || !mappings.card) {
        statusDiv.innerHTML = "Настройте маппинг полей в правой панели.";
        return;
      }

      localRecords = records;
      mappingIds = mappings;

      const realIdGroup = mappings.group; 
      const realIdCard = mappings.card;

      // Сначала асинхронно вычитываем структуру таблицы для получения справочника связей
      try {
        const rawColumns = await grist.docApi.fetchTable('_grist_Tables_column');
        const allColumns = normalizeGristData(rawColumns);
        const cardColMeta = allColumns.find(c => c.colId === realIdCard);
        
        if (cardColMeta && cardColMeta.type.includes(':')) {
          const targetTableId = cardColMeta.type.split(':')[1];
          const rawOptions = await grist.docApi.fetchTable(targetTableId);
          globalOptions = normalizeGristData(rawOptions);
          logStep(`[ИНФО] Справочник "${targetTableId}" загружен. Доступно вариантов: ${globalOptions.length}`);
        }
      } catch (e) {
        logStep("Ошибка чтения метаданных: " + e.message, true);
      }

      statusDiv.innerText = `Подключено. Записей: ${records.length}`;
      boardContainer.innerHTML = '';

      records.forEach(record => {
        const groupName = parseGristValue(record[realIdGroup]).trim() || `Строка №${record.id}`;
        
        let cardItems = [];
        const rawCardVal = record[realIdCard];
        
        if (rawCardVal) {
          let itemsArray = Array.isArray(rawCardVal) ? rawCardVal : [rawCardVal];
          itemsArray = itemsArray.filter(item => item !== 'L' && item !== 'O');

          itemsArray.forEach(item => {
            let numericId = null;
            let label = '';

            if (item && typeof item === 'object') {
              numericId = item.id !== undefined ? Number(item.id) : null;
              label = item.label || getRecordLabel(item);
            } 
            else if (!isNaN(item) && typeof item !== 'string' && item !== null) {
              numericId = Number(item);
              const opt = globalOptions.find(o => Number(o.id) === numericId);
              label = opt ? getRecordLabel(opt) : `ID ${numericId}`;
            } 
            else if (item) {
              const strVal = String(item).trim();
              const opt = globalOptions.find(o => getRecordLabel(o).trim() === strVal);
              if (opt) {
                numericId = Number(opt.id);
                label = strVal;
              } else {
                // Если маппинг полей неверный, выводим текст временно
                numericId = strVal;
                label = strVal;
              }
            }

            if (numericId !== null && numericId !== undefined) {
              cardItems.push({ id: numericId, label: label });
            }
          });
        }

        const columnEl = document.createElement('div');
        columnEl.className = 'kanban-column';
        columnEl.innerHTML = `
          <div class="column-header">
            <span class="column-title" title="${escapeHtml(groupName)}">${escapeHtml(groupName)}</span>
            <span class="column-count">${cardItems.length}</span>
          </div>
        `;

        const selectEl = document.createElement('select');
        selectEl.className = 'add-card-select';
        selectEl.setAttribute('data-record-id', record.id);
        selectEl.innerHTML = `<option value="" disabled selected>+ Добавить элемент...</option>`;

        const existingIds = cardItems.map(c => String(c.id));
        globalOptions.filter(opt => !existingIds.includes(String(opt.id))).forEach(opt => {
          const optionEl = document.createElement('option');
          optionEl.value = opt.id;
          optionEl.textContent = getRecordLabel(opt);
          selectEl.appendChild(optionEl);
        });
        columnEl.appendChild(selectEl);

        const cardsContainerEl = document.createElement('div');
        cardsContainerEl.className = 'cards-container';

        cardItems.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = 'kanban-card';
          cardEl.innerHTML = `
            <span class="card-text">${escapeHtml(card.label)}</span>
            <button class="delete-card-btn" data-record-id="${record.id}" data-item-id="${card.id}">&times;</button>
          `;
          cardsContainerEl.appendChild(cardEl);
        });

        columnEl.appendChild(cardsContainerEl);
        boardContainer.appendChild(columnEl);
      });
    });

    // --- УДАЛЕНИЕ СВЯЗИ (ЭЛЕМЕНТ В БАЗЕ ОСТАЕТСЯ) ---
    document.addEventListener('click', async (event) => {
      if (!event.target.classList.contains('delete-card-btn')) return;

      const btn = event.target;
      const recordId = Number(btn.getAttribute('data-record-id'));
      const itemIdToRemove = btn.getAttribute('data-item-id');

      logStep(`[РАЗРЫВ СВЯЗИ] Шаг 1: Клик на крестик. Строка Категории ID=${recordId}. Исключаем элемент ID=${itemIdToRemove}`);

      const columnButtons = document.querySelectorAll(`button[data-record-id="${recordId}"]`);
      let currentIds = [];
      
      columnButtons.forEach(b => {
        const idAttr = b.getAttribute('data-item-id');
        if (idAttr) {
          // Если ID числовой, сохраняем как число, иначе как строку
          currentIds.push(isNaN(idAttr) ? idAttr : Number(idAttr));
        }
      });

      // Исключаем удаляемый ID из массива связей этой строки
      const targetIdCompare = isNaN(itemIdToRemove) ? itemIdToRemove : Number(itemIdToRemove);
      const updatedIds = currentIds.filter(id => id !== targetIdCompare);

      try {
        const realIdCard = mappingIds.card;
        
        // КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ ДЛЯ ReferenceList:
        // Если массив пустеет, шлем пустой список Grist-команд [['O', '']] или чистый пустой массив в обертке.
        // Чтобы Grist не выдавал ошибку "AttributeError 'list' object has no attribute 'items'",
        // мы передаем корректный пустой токен для сброса связей ячейки.
        let finalPayloadValue;
        if (updatedIds.length === 0) {
          finalPayloadValue = ["L"]; // Чистый пустой массив конструктора списков Grist
        } else {
          finalPayloadValue = ['L', ...updatedIds];
        }

        const payload = {
          id: recordId,
          [realIdCard]: finalPayloadValue
        };

        logStep(`[РАЗРЫВ СВЯЗИ] Шаг 2: Отправка обновленного списка ID: ${JSON.stringify(finalPayloadValue)}`);
        await grist.getTable().updateRecords([payload]);
        logStep("[УСПЕХ] Шаг 3: Связь успешно удалена. Сам элемент в базе не тронут.");
      } catch (err) {
        logStep(`[ОШИБКА] Шаг 3: База отклонила изменение. Ошибка: ${err.message}`, true);
      }
    });

    // --- ДОБАВЛЕНИЕ СВЯЗИ ---
    document.addEventListener('change', async (event) => {
      if (!event.target.classList.contains('add-card-select')) return;

      const select = event.target;
      const recordId = Number(select.getAttribute('data-record-id'));
      const newItemId = isNaN(select.value) ? select.value : Number(select.value);

      logStep(`[НОВАЯ СВЯЗЬ] Шаг 1: Выбран элемент ID=${newItemId} для строки Категории ID=${recordId}`);

      const columnButtons = document.querySelectorAll(`button[data-record-id="${recordId}"]`);
      let currentIds = [];
      
      columnButtons.forEach(b => {
        const idAttr = b.getAttribute('data-item-id');
        if (idAttr) {
          currentIds.push(isNaN(idAttr) ? idAttr : Number(idAttr));
        }
      });

      if (!currentIds.includes(newItemId)) {
        const updatedIds = [...currentIds, newItemId];

        try {
          const realIdCard = mappingIds.card;
          const payload = {
            id: recordId,
            [realIdCard]: ['L', ...updatedIds]
          };

          logStep(`[НОВАЯ СВЯЗЬ] Шаг 2: Запись массива в базу...`);
          await grist.getTable().updateRecords([payload]);
          logStep("[УСПЕХ] Шаг 3: Новая связь успешно добавлена!");
        } catch (err) {
          logStep(`[ОШИБКА] Шаг 3: Ошибка сохранения: ${err.message}`, true);
        }
      }
    });

    function parseGristValue(value) {
      if (value === null || value === undefined) return '';
      if (Array.isArray(value)) return value.map(item => (item && item.label !== undefined) ? String(item.label) : String(item)).filter(i => i !== 'L' && i !== 'O').join(', ');
      if (typeof value === 'object' && value.label !== undefined) return String(value.label);
      return String(value);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
