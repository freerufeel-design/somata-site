<!doctype html><html lang="ru"><meta charset="utf-8"><title>Somata 16.4 — GPU Fourier Lamps</title><style>body{font:16px system-ui;max-width:850px;margin:3em auto;padding:0 1em}pre{white-space:pre-wrap;background:#eee;padding:1em}button{font:inherit;padding:.6em}</style>
<h1>GPU Fourier Lamps — проверка выборки дуги</h1><p>Исполняет ту же WGSL-функцию, что используется в рендерере ламп. Проверяет открытый и замкнутый контуры, включая последний сегмент. Чтение GPU используется только здесь.</p><button id="run">Запустить проверку</button><pre id="result">Ожидание</pre>
<script type="module">
import {FOURIER_LAMP_WGSL} from '../js/gpu/fourier-lamp-carrier.js';
const run=document.getElementById('run'),result=document.getElementById('result');
const fractions=[0,.001,.1,.333,.5,.9,.998,.99999,1];
function expected(points,f,closed){let total=0;const segs=[];for(let i=0;i<points.length-(closed?0:1);i++){const a=points[i],b=points[(i+1)%points.length],len=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,len,start:total});total+=len;}const d=f*total;const s=segs.find(s=>d<=s.start+s.len)||segs.at(-1);const t=Math.min(1,Math.max(0,(d-s.start)/Math.max(1e-12,s.len)));return [s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t];}
run.onclick=async()=>{run.disabled=true;result.textContent='';const log=s=>result.textContent+=s+'\n';let device;try{
 const adapter=await navigator.gpu?.requestAdapter();if(!adapter)throw Error('WebGPU adapter unavailable');device=await adapter.requestDevice();
 const module=device.createShaderModule({code:`struct Uniforms {root1:vec4<f32>}; @group(0) @binding(0) var<uniform> u:Uniforms; @group(0) @binding(1) var<storage,read> morphArcSegments:array<vec4<f32>>; @group(0) @binding(2) var<storage,read> fractions:array<f32>; @group(0) @binding(3) var<storage,read_write> output:array<vec2<f32>>; ${FOURIER_LAMP_WGSL} @compute @workgroup_size(1) fn main(@builtin(global_invocation_id) i:vec3<u32>){output[i.x]=sampleFourierLamp(fractions[i.x]);}`});
 const info=await module.getCompilationInfo();for(const m of info.messages)log(`${m.type}: ${m.message}`);if(info.messages.some(m=>m.type==='error'))throw Error('WGSL compilation failed');
 const pipeline=await device.createComputePipelineAsync({layout:'auto',compute:{module,entryPoint:'main'}});
 const storage=GPUBufferUsage.STORAGE,copy=GPUBufferUsage.COPY_DST;
 let passed=0;
 for(const closed of [false,true]){
 const points=Array.from({length:288},(_,i)=>{const t=i/(closed?288:287);return closed?[Math.fround(80*Math.cos(t*2*Math.PI)+12*Math.cos(t*6*Math.PI)),Math.fround(52*Math.sin(t*2*Math.PI))]:[Math.fround(160*t),Math.fround(30*Math.sin(7*t*t))];});
 let len=0;const data=new Float32Array(288*4);for(let i=0;i<288;i++){if(i)len+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);data.set([...points[i],1,len],i*4);}
 const make=(data,usage)=>{const b=device.createBuffer({size:data.byteLength,usage:usage|copy});device.queue.writeBuffer(b,0,data);return b;};
 const u=make(new Float32Array([0,0,1,closed?-2:-1]),GPUBufferUsage.UNIFORM),src=make(data,storage),f=make(new Float32Array(fractions),storage),size=fractions.length*8,out=device.createBuffer({size,usage:storage|GPUBufferUsage.COPY_SRC}),read=device.createBuffer({size,usage:GPUBufferUsage.MAP_READ|copy});
 device.pushErrorScope('validation');const bg=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[u,src,f,out].map((buffer,binding)=>({binding,resource:{buffer}}))});const e=device.createCommandEncoder(),p=e.beginComputePass();p.setPipeline(pipeline);p.setBindGroup(0,bg);p.dispatchWorkgroups(fractions.length);p.end();e.copyBufferToBuffer(out,0,read,0,size);device.queue.submit([e.finish()]);const error=await device.popErrorScope();if(error)throw Error(error.message);
 await read.mapAsync(GPUMapMode.READ);const a=new Float32Array(read.getMappedRange());let max=0;fractions.forEach((v,i)=>{const q=expected(points,v,closed);max=Math.max(max,Math.hypot(a[2*i]-q[0],a[2*i+1]-q[1]));});read.unmap();for(const b of [u,src,f,out,read])b.destroy();const ok=max<.005;passed+=ok;log(`${ok?'PASS':'FAIL'} ${closed?'closed':'open'}: max Δxy=${max.toFixed(7)}`);
 }log(`${passed}/2 PASS`);
 }catch(e){log('ERROR: '+e.message);}finally{device?.destroy();run.disabled=false;}};
</script></html>
