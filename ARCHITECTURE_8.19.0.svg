<text x="38" y="50" fill="#ffffff" font-size="27" font-family="sans-serif" font-weight="bold">Somata 8.19 — Palette Lag / Blue Morph</text>
<text x="38" y="80" fill="#9aacc7" font-size="16" font-family="sans-serif">Один выбранный источник палитры, непрерывное положение цвета, независимые слои</text>
<rect x="38" y="118" width="290" height="105" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="55" y="156" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Blue Morph</text><text x="55" y="188" fill="#9fd3ff" font-family="sans-serif" font-size="15">source → target / geometryT</text><rect x="387" y="118" width="310" height="105" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="404" y="156" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Выбранная палитра</text><text x="404" y="188" fill="#9fd3ff" font-family="sans-serif" font-size="15">state.morph.lineColorPalette</text><rect x="760" y="118" width="282" height="105" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="777" y="156" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Palette Lag</text><text x="777" y="188" fill="#9fd3ff" font-family="sans-serif" font-size="15">дробный индекс + blend</text><rect x="38" y="340" width="290" height="100" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="55" y="378" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Static / Orange</text><text x="55" y="410" fill="#9fd3ff" font-family="sans-serif" font-size="15">совместимый старый путь</text><rect x="387" y="340" width="310" height="100" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="404" y="378" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Corridor frame</text><text x="404" y="410" fill="#9fd3ff" font-family="sans-serif" font-size="15">Stroke + Fill + alpha</text><rect x="760" y="340" width="282" height="100" rx="14" fill="#1d2a40" stroke="#46627f" stroke-width="2"/><text x="777" y="378" fill="#ffffff" font-family="sans-serif" font-size="21" font-weight="bold">Render passes</text><text x="777" y="410" fill="#9fd3ff" font-family="sans-serif" font-size="15">Glow / Base / Fill / GPU</text><g stroke="#55c4a0" stroke-width="3" fill="none"><path d="M328 170 H387"/><path d="M697 170 H760"/><path d="M900 224 V340"/><path d="M697 390 H760"/></g><g stroke="#7891ae" stroke-width="3" fill="none"><path d="M328 390 H387"/></g>
<text x="38" y="498" fill="#d4e5f6" font-family="sans-serif" font-size="16">Смена палитр по циклам остаётся отдельной явной настройкой.</text>
